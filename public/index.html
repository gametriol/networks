<!DOCTYPE html>
<html>
<head>
  <title>LAN Chatroom</title>
  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: #fff; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; }
    #chat-box { width: 60%; max-height: 70vh; overflow-y: auto; border: 1px solid #444; border-radius: 10px; padding: 10px; margin-top: 20px; background: #2b2b2b; }
    #users { margin-top: 10px; color: #aaa; }
    #input-box { margin-top: 10px; display: flex; width: 60%; }
    input { flex: 1; padding: 8px; border: none; border-radius: 5px; }
    button { padding: 8px 16px; margin-left: 5px; border: none; border-radius: 5px; background: #0078ff; color: #fff; cursor: pointer; }
    .msg { margin: 5px 0; }
    .server { color: #ffa500; }
  </style>
</head>
<body>
  <h2>LAN Chatroom</h2>
  <div id="users">Active users: 0</div>
  <div id="chat-box"></div>

  <div id="input-box">
    <input id="msg" placeholder="Type a message..." autocomplete="off" />
    <button id="send">Send</button>
  </div>
  <div id="network-section" style="width:60%; margin-top:15px;">
  <button id="detect">🔍 Detect Network Info</button>
  <pre id="network-info" style="background:#111; color:#0f0; padding:10px; border-radius:8px; margin-top:8px; white-space:pre-wrap; display:none;"></pre>
</div>


  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
